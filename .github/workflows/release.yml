name: Release

on:
  push:
    branches: [main]

# Serialize releases so overlapping merges to main can't publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags + GitHub Releases
  id-token: write # OIDC trusted publishing to npm (no NPM_TOKEN)
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # >= 22.14 for OIDC trusted publishing
          registry-url: 'https://registry.npmjs.org'
      - run: npm i -g npm@latest # >= 11.5.1 for OIDC
      - run: npm ci --legacy-peer-deps
      - run: npm run build:all
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
