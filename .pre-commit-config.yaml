# Pre-commit hooks for @datagrail.io/react-native-consent.
#   Setup:  pre-commit install
#   Manual: pre-commit run --all-files
minimum_pre_commit_version: '3.5.0'

repos:
  # General hygiene + safety nets (catch build artifacts, secrets, huge blobs).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(snap|lock)$'
      - id: end-of-file-fixer
        exclude: '\.(snap|lock)$'
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
        # Maestro e2e flows are multi-document YAML (config header --- steps).
        args: [--allow-multiple-documents]
      - id: check-json
        # Android gradlew/wrapper + generated native scaffold aren't ours to lint.
        exclude: '^test-client/android/'
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Project tooling — run the same commands CI does, via the repo's own configs.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: '\.(ts|tsx|js|jsx|json|md|yaml|yml)$'
        # test-config.json fixtures are raw backend-response snapshots; keep them
        # verbatim rather than reflowing their formatting.
        exclude: '^(test-client/android/|.*\.lock$|package-lock\.json$|.*/test-config\.json$)'

      - id: eslint
        name: eslint (src)
        entry: npm run lint
        language: system
        files: '^src/.*\.(ts|tsx)$'
        pass_filenames: false

      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        files: '\.(ts|tsx)$'
        pass_filenames: false
