appId: ${APP_ID}
name: Consent dialog - Banner and Preference Center
---
- launchApp:
    stopApp: true
- assertVisible: 'API Exercise'

- tapOn:
    id: 'btn-reset'
- extendedWaitUntil:
    visible:
      id: 'result-reset-ok'
    timeout: 10000
- tapOn:
    id: 'btn-initialize-sticky'
- scrollUntilVisible:
    element:
      id: 'result-initialize-ok'
    direction: UP
    timeout: 30000
    visibilityPercentage: 50
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-02-consent-00-initialized'

- tapOn:
    id: 'tab-banner'
- assertVisible:
    id: 'banner-container'
- assertVisible:
    id: 'banner-action-custom'
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-02-consent-01-banner-visible'

- tapOn:
    id: 'banner-action-custom'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-02-consent-02-accepted'

- scrollUntilVisible:
    element:
      id: 'mode-preferenceCenter'
    direction: UP
    timeout: 30000
- tapOn:
    id: 'mode-preferenceCenter'
- assertVisible:
    id: 'preference-center'
- assertVisible:
    id: 'save-button'
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-02-consent-03-preference-center'
