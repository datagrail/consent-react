appId: ${APP_ID}
name: API Exercise - all public methods
---
- launchApp:
    stopApp: true
- assertVisible: 'API Exercise'
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-01-api-00-launched'

# Initialization
- tapOn:
    id: 'btn-reset'
- extendedWaitUntil:
    visible:
      id: 'result-reset-ok'
    timeout: 10000
- tapOn:
    id: 'btn-initialize-sticky'
- scrollUntilVisible:
    element:
      id: 'result-initialize-ok'
    direction: UP
    timeout: 30000
    visibilityPercentage: 50
- takeScreenshot: 'e2e/screenshots/${PLATFORM}-01-api-01-initialized'

# Synchronous consent state reads
- scrollUntilVisible:
    element:
      id: 'btn-needsConsent'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'btn-needsConsent'
- extendedWaitUntil:
    visible:
      id: 'result-needsConsent-ok'
    timeout: 10000

- scrollUntilVisible:
